name: Validate Part 3 Date Metadata

on:
  push:
    branches:
      - fix/part3-date-metadata
    paths:
      - .github/workflows/part3-date-metadata-validation.yml
      - api/part3/**

permissions:
  contents: read

jobs:
  build-part3:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    defaults:
      run:
        shell: sh
        working-directory: api/part3/standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Part 3 Draft
        id: compile
        continue-on-error: true
        run: |
          set +e
          metanorma compile --agree-to-terms -t ogc -x html,pdf,xml 23-003r0.adoc > metanorma-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat metanorma-build.log
          exit 0

      - name: List Generated Files
        if: always()
        run: |
          ls -la

      - name: Upload Part 3 Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part3-date-metadata-${{ github.sha }}
          if-no-files-found: warn
          path: |
            api/part3/standard/23-003r0.html
            api/part3/standard/23-003r0.pdf
            api/part3/standard/23-003r0.xml
            api/part3/standard/23-003r0.err
            api/part3/standard/23-003r0.pdf.err
            api/part3/standard/23-003r0.err.html
            api/part3/standard/23-003r0.xml.abort
            api/part3/standard/23-003r0.asciidoc.log.txt
            api/part3/standard/metanorma-build.log

      - name: Fail If Compile Failed
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "Metanorma compile failed with exit code ${{ steps.compile.outputs.exit_code }}"
          exit 1
