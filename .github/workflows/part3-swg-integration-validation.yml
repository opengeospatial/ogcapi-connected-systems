name: Validate Part 3 SWG Integration

on:
  pull_request:
    branches:
      - part3-working-draft
    paths:
      - .github/workflows/part3-swg-integration-validation.yml
      - api/part3/**

permissions:
  contents: read

jobs:
  build-part3:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    defaults:
      run:
        shell: sh
        working-directory: api/part3/standard
    steps:
      - name: Checkout pull request merge result
        uses: actions/checkout@v4

      - name: Compile Part 3 draft
        id: compile
        continue-on-error: true
        run: |
          set +e
          metanorma compile --agree-to-terms -t ogc -x html,pdf,xml 23-003r0.adoc > metanorma-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat metanorma-build.log
          exit 0

      - name: Inspect generated outputs
        if: always()
        run: |
          ls -la
          test -s 23-003r0.html
          test -s 23-003r0.pdf
          test -s 23-003r0.xml

      - name: Upload Part 3 build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part3-swg-integration-${{ github.sha }}
          if-no-files-found: error
          path: |
            api/part3/standard/23-003r0.html
            api/part3/standard/23-003r0.pdf
            api/part3/standard/23-003r0.xml
            api/part3/standard/23-003r0.err
            api/part3/standard/23-003r0.pdf.err
            api/part3/standard/23-003r0.err.html
            api/part3/standard/23-003r0.xml.abort
            api/part3/standard/23-003r0.asciidoc.log.txt
            api/part3/standard/metanorma-build.log

      - name: Fail if compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "Metanorma compilation failed with exit code ${{ steps.compile.outputs.exit_code }}"
          exit 1
