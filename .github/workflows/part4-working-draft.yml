name: Build Part 4 Working Draft

on:
  workflow_dispatch:
  push:
    branches:
      - part4-working-draft
    paths:
      - .github/workflows/part4-working-draft.yml
      - api/part4/**

permissions:
  contents: read

jobs:
  build-part4:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    defaults:
      run:
        shell: sh
        working-directory: api/part4/standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Build Workspace
        run: |
          ln -sfn ../openapi openapi
          ln -sfn ../figures figures
          mkdir -p requirements/sampling
          cp ../requirements/sampling/*.adoc requirements/sampling/
          cp ../sections/clause_13_sampling_feature_types.adoc sections/clause_13_sampling_feature_types.adoc
          sed 's@include::\.\./sections/clause_13_sampling_feature_types\.adoc\[\]@include::sections/clause_13_sampling_feature_types.adoc[]@' 23-004r0.adoc > 23-004r0.build.adoc

      - name: Compile Part 4 Draft
        id: compile
        continue-on-error: true
        run: |
          set +e
          metanorma compile --agree-to-terms -t ogc -x html,pdf,xml 23-004r0.build.adoc > metanorma-build.log 2>&1
          status=$?
          for ext in html pdf xml err pdf.err presentation.xml rxl; do
            if [ -f "23-004r0.build.$ext" ]; then mv "23-004r0.build.$ext" "23-004r0.$ext"; fi
          done
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat metanorma-build.log
          exit 0

      - name: List Generated Files
        if: always()
        run: |
          ls -la

      - name: Upload Part 4 Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part4-working-draft-${{ github.sha }}
          if-no-files-found: warn
          path: |
            api/part4/standard/23-004r0.html
            api/part4/standard/23-004r0.pdf
            api/part4/standard/23-004r0.xml
            api/part4/standard/23-004r0.err
            api/part4/standard/23-004r0.pdf.err
            api/part4/standard/23-004r0.build.err.html
            api/part4/standard/23-004r0.build.xml.abort
            api/part4/standard/23-004r0.build.asciidoc.log.txt
            api/part4/standard/metanorma-build.log

      - name: Fail If Compile Failed
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "Metanorma compile failed with exit code ${{ steps.compile.outputs.exit_code }}"
          exit 1
