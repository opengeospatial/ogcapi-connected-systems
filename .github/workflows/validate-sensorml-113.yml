name: Validate SensorML issue 113

on:
  push:
    branches:
      - fix/113-define-uav
    paths:
      - .github/workflows/validate-sensorml-113.yml
      - sensorml/**

permissions:
  contents: read

jobs:
  build-sensorml:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    defaults:
      run:
        shell: sh
        working-directory: sensorml/standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile SensorML
        id: compile
        continue-on-error: true
        run: |
          set +e
          metanorma compile --agree-to-terms -t ogc -x html,pdf,xml 23-000.adoc > metanorma-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat metanorma-build.log
          exit 0

      - name: Upload SensorML build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensorml-issue-113-${{ github.sha }}
          if-no-files-found: warn
          path: |
            sensorml/standard/23-000.html
            sensorml/standard/23-000.pdf
            sensorml/standard/23-000.xml
            sensorml/standard/23-000.err
            sensorml/standard/23-000.pdf.err
            sensorml/standard/23-000.presentation.xml
            sensorml/standard/23-000.rxl
            sensorml/standard/metanorma-build.log

      - name: Fail if compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "Metanorma compile failed with exit code ${{ steps.compile.outputs.exit_code }}"
          exit 1
