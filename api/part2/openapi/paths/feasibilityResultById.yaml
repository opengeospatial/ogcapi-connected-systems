parameters:
  - $ref: ../parameters/feasibilityId.yaml
  - $ref: ../parameters/resultId.yaml

get:
  summary: Get a feasibility result item by ID
  tags:
    - Command Feasibility
  responses:
    '200':
      $ref: ../responses/feasibilityResult.yaml
    '400':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/400
    '401':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/401
    '403':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/403
    '404':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/404
    '5XX':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/5XX

put:
  summary: Update a feasibility result item
  description: |-
    Replace a feasibility result item. Inline `data` is encoded according to the parent ControlStream's `feasibilityResultSchema`.
  tags:
    - Command Feasibility
  requestBody:
    $ref: ../requests/feasibilityResult.yaml
  responses:
    '204':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/204_PUT
    '400':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/400
    '401':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/401
    '403':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/403
    '404':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/404
    '5XX':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/5XX

delete:
  summary: Delete a feasibility result item
  tags:
    - Command Feasibility
  responses:
    '204':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/204_DELETE
    '400':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/400
    '401':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/401
    '403':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/403
    '404':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/404
    '409':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/409_DELETE
    '5XX':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/5XX
