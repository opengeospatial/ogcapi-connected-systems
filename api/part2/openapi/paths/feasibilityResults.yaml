parameters:
  - $ref: ../parameters/feasibilityId.yaml

get:
  summary: List feasibility result items
  description: |-
    List or search all result items associated with a feasibility request.
  tags:
    - Command Feasibility
  parameters:
    - $ref: ../../../part1/openapi/parameters/idList.yaml
    - $ref: ../../../part1/openapi/parameters/limit.yaml
  responses:
    '200':
      $ref: ../responses/feasibilityResultCollection.yaml
    '400':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/400
    '401':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/401
    '403':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/403
    '404':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/404
    '5XX':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/5XX

post:
  summary: Add a feasibility result item
  description: |-
    Add a result produced by a feasibility analysis. Inline `data` is encoded according to the parent ControlStream's `feasibilityResultSchema`.
  tags:
    - Command Feasibility
  requestBody:
    $ref: ../requests/feasibilityResult.yaml
  responses:
    '201':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/201
    '400':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/400
    '401':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/401
    '403':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/403
    '404':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/404
    '5XX':
      $ref: ../../../part1/openapi/responses/StandardResponses.yaml#/5XX
