description: One or more command resources
required: true
content:
  application/json:
    schema:
      oneOf:
      - title: Single Command
        $ref: ../schemas/json/command_create.json
      - title: Multiple Commands
        type: array
        minItems: 1
        items:
          $ref: ../schemas/json/command_create.json
    examples:
      ptz:
        summary: PTZ Command
        externalValue: examples/commands/command-ptz-create.json
      batch:
        summary: Two PTZ commands
        externalValue: examples/commands/command-array-create.json
