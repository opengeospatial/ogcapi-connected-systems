description: One or more control stream resources
required: true
content:
  application/json:
    schema:
      oneOf:
      - title: Single Control Stream
        $ref: ../schemas/json/controlStream_create.json
      - title: Multiple Control Streams
        type: array
        minItems: 1
        items:
          $ref: ../schemas/json/controlStream_create.json
    examples:
      ptz:
        summary: PTZ Control
        externalValue: examples/controlstreams/controlstream-ptz-create.json
      batch:
        summary: Two control streams
        externalValue: examples/controlstreams/controlstream-array-create.json
