description: One or more observation resources
required: true
content:
  application/json:
    schema:
      oneOf:
      - title: Single Observation
        $ref: ../schemas/json/observation_create.json
      - title: Multiple Observations
        type: array
        minItems: 1
        items:
          $ref: ../schemas/json/observation_create.json
    examples:
      simple:
        summary: Scalar Observation (Measure)
        externalValue: examples/observations/obs-simple-create.json
      location:
        summary: Vector Observation (Location)
        externalValue: examples/observations/obs-location-create.json
      profile:
        summary: Profile Observation
        externalValue: examples/observations/obs-profile-create.json
      link:
        summary: Observation with link to external result
        externalValue: examples/observations/obs-link-create.json
      batch:
        summary: Inline and external-result observations
        externalValue: examples/observations/observation-array-create.json
