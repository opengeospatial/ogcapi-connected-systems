description: One or more system event resources
required: true
content:
  application/json:
    schema:
      oneOf:
      - title: Single Event
        $ref: ../schemas/json/systemEvent_create.json
      - title: Multiple Events
        type: array
        minItems: 1
        items:
          $ref: ../schemas/json/systemEvent_create.json
    examples:
      simple:
        summary: Deployment event
        externalValue: examples/events/systemEvent-create.json
      batch:
        summary: Deployment and calibration events
        externalValue: examples/events/systemEvent-array-create.json
